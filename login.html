<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — UOK Library</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body style="background: var(--surface-2); min-height: 100vh; display: flex; flex-direction: column;">

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="logo-icon">📚</div>
    <span>UOK Library</span>
  </a>
  <div class="navbar-nav">
    <span style="color:rgba(255,255,255,0.6); font-size:0.9rem;">No account?</span>
    <a href="signup.html" class="nav-btn">Register</a>
  </div>
</nav>

<div class="form-container" style="margin-top: 60px; flex: 1;">
  <div class="form-card">
    <div class="form-header">
      <div style="font-size: 2.5rem; margin-bottom: 12px;">📚</div>
      <h2>Welcome Back</h2>
      <p>Sign in to manage your library seat</p>
    </div>
    <div class="form-body">

      <form id="loginForm">
        <div class="form-group">
          <label for="reg_number">Registration Number</label>
          <input type="text" id="reg_number" class="form-control" 
            placeholder="e.g. COM/M/0056/2023" required 
            autocomplete="username" maxlength="24">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" 
            placeholder="Your password" required 
            autocomplete="current-password">
        </div>

        <!-- Alert renders here, inside form so it's visible -->
        <div id="login-alert"></div>

        <button type="submit" id="login-btn" class="btn btn-primary w-full" 
          style="margin-top: 16px; border-radius: var(--radius-sm);">
          Sign In →
        </button>
      </form>

      <p class="text-center mt-4" style="font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? 
        <a href="/signup" style="color: var(--primary-light); font-weight: 600;">Register here</a>
      </p>
      <hr style="border: none; border-top: 1px solid var(--border); margin: 24px 0;">
    </div>
  </div>
</div>

<footer class="footer" style="margin-top: 40px;">
  <p>© 2024 <strong>UOK Library Seat Reservation System</strong></p>
</footer>

<script src="js/login.js"></script>
</body>
</html>
